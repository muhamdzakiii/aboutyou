<style>

.cs{background:#5b5e8f;border-radius:6px 14px 14px 6px;filter:blur(12px);transform:translate(11%,9%) scale(.97);opacity:.8}
.gb{position:absolute;right:calc(50% + var(--cvw)/2 + var(--cvw)*.11);bottom:calc(100% - 52.3% - var(--cvh)/2*1 + 0px);width:calc(var(--cvw)*.9);height:calc(var(--cvh)*.85);background:#4fba70;border-radius:8px 14px 14px 8px;box-shadow:inset -4px 0 0 rgba(0,0,0,.08)}
.cover{background:#f6f5f8;border-radius:5px 14px 14px 5px;transform-origin:left center;overflow:hidden;font-family:"Gochi Hand","Segoe Print","Comic Sans MS",cursive;color:#1a1a1a;font-size:calc(var(--cvw)/8)}

@keyframes fadeIn { from { opacity: 0; } }

.scene { animation: rise .9s .2s cubic-bezier(.2, .8, .2, 1) both; }
</style>

  var ri=Math.min(i+1,n-1),Fi=last?null:Fs[i],sn=Math.sin(PI*Math.max(f,0));
  show([Ls[i],Rs[ri],Fi]);
  Ls[i].style.setProperty('--dm',(.10*sn).toFixed(3));Rs[ri].style.setProperty('--dm',last?0:(.08*sn).toFixed(3));
  if(Fi){Fi.style.transform='translateZ('+(3+10*sn).toFixed(2)+'px) rotateY('+(-180*f).toFixed(3)+'deg)';Fi.style.setProperty('--sh',sn.toFixed(3))}
}
function pb(h){return '<div class="pb">'+h+'</div>'}
function build(){
  stack.innerHTML='';shown=[];sheets=[];Ls=[];Rs=[];Fs=[];
  spread=document.createElement('div');spread.className='spread';stack.appendChild(spread);
  P.forEach(function(p){var d=document.createElement('div');d.className='sheet';d.style.setProperty('--e',p[0]);
    d.innerHTML='<div class="fc">'+p[1]+'</div><div class="bk"></div>';stack.appendChild(d);sheets.push(d)});
  stack.appendChild(back);back._c='';
  P.forEach(function(p,i){
    var l=document.createElement('div');l.className='half l';l.innerHTML=pb(p[1])+'<div class="dm"></div>';
    var r=document.createElement('div');r.className='half r';r.innerHTML=pb(p[1])+'<div class="dm"></div>';
    stack.appendChild(l);stack.appendChild(r);Ls.push(l);Rs.push(r);
    if(i<P.length-1){var f=document.createElement('div');f.className='flap';
      f.innerHTML='<div class="ff">'+pb(p[1])+'<div class="sh"></div></div><div class="fb">'+pb(P[i+1][1])+'<div class="sh"></div></div>';
      stack.appendChild(f);Fs.push(f)}
  });
}
function canFlip(){return isOpen&&OS.t===1&&OS.x>.85}
function goTo(t,w){PS.t=t;kick(PS,w||16,1);wake()}
function next(){if(!canFlip())return;var t=Math.round(PS.t)+1;if(t<=sheets.length-1)goTo(t)}
function prev(){if(!canFlip())return;var t=Math.round(PS.t)-1;if(t>=0)goTo(t)}
function jump(t){if(canFlip()&&Math.round(PS.t)!==t)goTo(t,12.5)}

/* musik latar */
var bgm=new Audio('musik-scrapbook.mp3');bgm.preload='auto';bgm.volume=0;
var VOL=.6,fadeT=0;
function fadeTo(v,ms,done){
  cancelAnimationFrame(fadeT);var a=bgm.volume,t0=performance.now();
  (function f(n){var p=Math.min(1,(n-t0)/ms);bgm.volume=a+(v-a)*p*(2-p);
    if(p<1)fadeT=requestAnimationFrame(f);else if(done)done()})(t0);
}
function musicOn(){bgm.play().then(function(){fadeTo(VOL,1600)}).catch(function(){})}
function musicOff(){fadeTo(0,700,function(){bgm.pause()})}
bgm.addEventListener('ended',function(){bgm.currentTime=0;if(isOpen)musicOn()});
document.addEventListener('visibilitychange',function(){if(document.hidden)bgm.pause();else if(isOpen)musicOn()});

function open(){if(isOpen)return;isOpen=true;document.body.classList.add('open');OS.t=1;kick(OS,13,.72);musicOn();wake()}
function closeBook(){if(!isOpen)return;isOpen=false;document.body.classList.remove('open');PS.drag=false;drag=null;OS.t=0;kick(OS,10,.85);musicOff();wake()}
cover.addEventListener('click',open);
cover.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')open()});
function Wd(){return stack.offsetWidth*.8}
scene.addEventListener('pointerdown',function(e){
  if(drag){PS.drag=false;drag=null}
  if(!canFlip())return;
  drag={id:e.pointerId,x0:e.clientX,p0:PS.x,moved:false,dx:0,h:[]};
  try{scene.setPointerCapture(e.pointerId)}catch(_){}
});
window.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;var dx=e.clientX-drag.x0;
  if(!drag.moved){if(Math.abs(dx)<6)return;drag.moved=true;drag.x0=e.clientX;drag.p0=PS.x;PS.drag=true;PS.v=0;dx=0}
  drag.dx=dx;var raw=drag.p0-dx/Wd(),hi=sheets.length-1;
  if(raw<0)raw*=.3;else if(raw>hi)raw=hi+(raw-hi)*.3;   /* efek karet di ujung buku */
  PS.x=raw;var now=performance.now();drag.h.push([raw,now]);
  while(drag.h.length>2&&now-drag.h[0][1]>100)drag.h.shift();
  wake();
});
function release(e){
  if(!drag)return;
  if(e.pointerId!=null&&e.pointerId!==drag.id)return;
  var d=drag;drag=null;PS.drag=false;
  if(!d.moved){if(!canFlip()||e.type!=='pointerup')return;var b=scene.getBoundingClientRect();(e.clientX>b.left+b.width/2?next:prev)();return}
  var h=d.h,v=0;
  if(h.length>1){var a=h[0],z=h[h.length-1],dt=(z[1]-a[1])/1000;if(dt>.001)v=(z[0]-a[0])/dt}
  v=clamp(v,-14,14);PS.drag=false;
  var b0=Math.round(d.p0),f=PS.x+v*.12+(d.dx<0?.25:-.25);   /* lepas jari: lanjut sesuai arah & kecepatan geser */
  PS.t=clamp(clamp(Math.round(f),b0-1,b0+1),0,sheets.length-1);PS.v=v;kick(PS,16,.92);wake();
}
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
scene.addEventListener('lostpointercapture',release);window.addEventListener('blur',release);
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
function say(t){toast.textContent=t;toast.classList.add('on');setTimeout(function(){toast.classList.remove('on')},1600)}
document.querySelector('.top').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='close')closeBook();else jump(b.dataset.a==='last'?sheets.length-1:0)});
build();
})();
</script>
</body>
</html>
