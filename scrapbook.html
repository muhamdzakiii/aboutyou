<style>
:root{--cw:min(100vw,430px);--pw:min(calc(var(--cw)*.82),50vh);--ph:calc(var(--pw)/1.17);--cvw:min(calc(var(--cw)*.634),34vh);--cvh:calc(var(--cvw)*1.49);--b:calc(var(--cw)*.107);box-sizing:border-box;color-scheme:dark}

html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:#807d9c;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;transition:background .6s ease}

.ic{width:var(--b);height:var(--b);border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);display:grid;place-items:center;cursor:pointer;padding:0}

.cnt{position:absolute;top:calc(21.9% - 8px);left:0;right:0;text-align:center;font-size:calc(var(--cw)*.034);font-weight:600;opacity:.85;display:flex;justify-content:center;align-items:center;gap:6px}

.scene{position:absolute;inset:0;perspective:1700px;perspective-origin:50% 52%;touch-action:none;cursor:pointer}
.stack,.cover,.cs,.osh{position:absolute;left:50%;top:52.3%}

.p1{left:14%;top:38%;transform:rotate(-6deg)}

.cover{background-image:radial-gradient(rgba(60,50,90,.09) 1px,transparent 1.3px);background-size:11px 11px}

.st{position:absolute;font-style:normal;color:#f0aa22;z-index:1}
.hint{position:absolute;right:6%;bottom:3.5%;font-size:.55em;color:#8c8798;transform:rotate(-4deg);z-index:1}

.dm{position:absolute;inset:0;pointer-events:none;background:#1f2347;opacity:var(--dm,0)}
.back{background:#bba68d}
.bar{position:absolute;top:84.8%;left:0;right:0;display:flex;justify-content:center;gap:calc(var(--b)*.26);transform:translateY(-50%);transition:opacity .3s}
.bar button{width:var(--b);height:var(--b);border-radius:50%;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}

.toast{position:fixed;bottom:12%;left:50%;transform:translateX(-50%);background:#fff;color:#2b3150;font-size:13px;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}

.topc{position:absolute;top:5%;left:4%;right:4%;display:flex;justify-content:space-between;align-items:flex-start}

.ic.w{background:#fff;border-color:#fff}.ic.w svg{stroke:#262a40}

.pg{width:100%;height:100%;position:relative;background:#f3f3f6;font-family:"Gochi Hand","Segoe Print","Comic Sans MS",cursive;color:#111;font-size:calc(var(--pw)/20);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:5%}

</style>

var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,A=.5,PI=Math.PI,sheets=[],isOpen=false,emo=['🌸','🦋','⭐','🍓','☁️','🎀','🌈','🍒'];
/* Dua "pegas" fisika: OS = buka/tutup buku (0..1), PS = posisi halaman (float, 0..n-1). Semua transform dihitung dari dua angka ini tiap frame. */
var OS={x:0,v:0,t:0,w:11,z:.8},PS={x:0,v:0,t:0,w:16,z:1,drag:false},raf=0,last=0,acc=0,drag=null;
var back=document.createElement('div');back.className='sheet back';back.style.borderRadius='7px';
function clamp(v,a,b){return v<a?a:v>b?b:v}
function sgn(x,p){return x<0?-Math.pow(-x,p):Math.pow(x,p)}
function kick(o,w,z){o.w=w*(RM?2.5:1);o.z=z}
function step(o,h){o.v+=(-o.w*o.w*(o.x-o.t)-2*o.z*o.w*o.v)*h;o.x+=o.v*h}
function rest(o,e){return Math.abs(o.x-o.t)<e&&Math.abs(o.v)<.005}
function active(){return PS.drag||!rest(OS,8e-4)||!rest(PS,5e-4)}
function wake(){if(!raf){last=performance.now();acc=0;raf=requestAnimationFrame(tick)}}
function tick(now){
  raf=0;acc+=Math.min(.05,(now-last)/1000);last=now;var H=1/240;
  while(acc>=H){if(!PS.drag)step(PS,H);step(OS,H);acc-=H}
  if(rest(OS,8e-4)){OS.x=OS.t;OS.v=0}
  if(!PS.drag&&rest(PS,5e-4)){PS.x=PS.t;PS.v=0}
  render();if(active())raf=requestAnimationFrame(tick);
}
var Ls=[],Rs=[],Fs=[],shown=[],spread;
function show(l){shown.forEach(function(e){if(l.indexOf(e)<0)e.style.visibility='hidden'});l.forEach(function(e){if(e)e.style.visibility='inherit'});shown=l.filter(Boolean)}
var FAN=0;
function paint(el,t,isBack){
  var x,r=0,sx,sy,z,vis=true,k,kc;
  if(t<=0){k=-t;kc=k>2?2:k;x=18*kc;sx=sy=1-.04*kc;z=-2*k-4-(isBack?1:0);vis=k<3.6;r=FAN*kc*9}
  else if(t<1){x=0;r=-180;sx=Math.max(.0005,.15*t*t*(3-2*t));sy=.96;z=-6}   /* halaman yang baru dibalik: strip kiri tumbuh pelan */
  else{k=t;kc=k>2?2:k;x=-(kc-1)*2.4;r=-180;sx=.15;sy=.96;z=-2*k-4;vis=k<3.6}
  var tr='translate3d('+x.toFixed(3)+'%,0,'+z.toFixed(2)+'px) rotateY('+r+'deg) scale('+sx.toFixed(4)+','+sy.toFixed(4)+')',c=tr+vis;
  if(el._c===c)return;el._c=c;el.style.transform=tr;el.style.visibility=vis?'':'hidden';
}
function render(){
  var s=OS.x,g=clamp(1-s/.12,0,1),tz=(310*sgn(Math.sin(PI*s),1.2)).toFixed(2);
  gb.style.opacity=g;cs.style.opacity=.8*g;
  if(s<A){
    cover.style.visibility='';stack.style.visibility='hidden';
    cover.style.transform='translateZ('+tz+'px) rotateY('+(89*sgn(s/A,1.3)).toFixed(3)+'deg)';
    if(!isOpen&&(PS.x||PS.t||PS.v)){PS.x=PS.t=PS.v=0}
    return;
  }
  cover.style.visibility='hidden';stack.style.visibility='visible';
  FAN=clamp(1-(s-A)/(1-A),0,1);
  stack.style.transform='translateZ('+tz+'px) rotateY('+(87*sgn(1-(s-A)/(1-A),1.35)).toFixed(3)+'deg)';
  var pos=PS.x,n=sheets.length,i=clamp(Math.floor(pos),0,n-1),last=i>=n-1,f=last?0:clamp(pos-i,0,1)
  for(var j=0;j<n;j++)paint(sheets[j],pos-j);
  paint(back,pos-n,true);
  /* spread: kiri = halaman i, kanan = halaman i+1, dan separuh kanan halaman i berputar di garis tekukan tengah */
  var ri=Math.min(i+1,n-1),Fi=last?null:Fs[i],sn=Math.sin(PI*Math.max(f,0));
  show([Ls[i],Rs[ri],Fi]);
  Ls[i].style.setProperty('--dm',(.10*sn).toFixed(3));Rs[ri].style.setProperty('--dm',last?0:(.08*sn).toFixed(3));
  if(Fi){Fi.style.transform='translateZ('+(3+10*sn).toFixed(2)+'px) rotateY('+(-180*f).toFixed(3)+'deg)';Fi.style.setProperty('--sh',sn.toFixed(3))}
}
function pb(h){return '<div class="pb">'+h+'</div>'}
function build(){
  stack.innerHTML='';shown=[];sheets=[];Ls=[];Rs=[];Fs=[];
  spread=document.createElement('div');spread.className='spread';stack.appendChild(spread);
  P.forEach(function(p){var d=document.createElement('div');d.className='sheet';d.style.setProperty('--e',p[0]);
    d.innerHTML='<div class="fc" style="background:'+p[0]+'"></div><div class="bk"></div>';stack.appendChild(d);sheets.push(d)});
  stack.appendChild(back);back._c='';
  P.forEach(function(p,i){
    var l=document.createElement('div');l.className='half l';l.innerHTML=pb(p[1])+'<div class="dm"></div>';
    var r=document.createElement('div');r.className='half r';r.innerHTML=pb(p[1])+'<div class="dm"></div>';
    stack.appendChild(l);stack.appendChild(r);Ls.push(l);Rs.push(r);
    if(i<P.length-1){var f=document.createElement('div');f.className='flap';
      f.innerHTML='<div class="ff">'+pb(p[1])+'<div class="sh"></div></div><div class="fb">'+pb(P[i+1][1])+'<div class="sh"></div></div>';
      stack.appendChild(f);Fs.push(f)}
  });
}
function canFlip(){return isOpen&&OS.t===1&&OS.x>.85}
function goTo(t,w){PS.t=t;kick(PS,w||16,1);wake()}
function next(){if(!canFlip())return;var t=Math.round(PS.t)+1;if(t<=sheets.length-1)goTo(t)}
function prev(){if(!canFlip())return;var t=Math.round(PS.t)-1;if(t>=0)goTo(t)}
function jump(t){if(canFlip()&&Math.round(PS.t)!==t)goTo(t,12.5)}

/* musik latar */
var bgm=new Audio('musik-scrapbook.mp3');bgm.preload='auto';bgm.volume=0;
var VOL=.6,fadeT=0;
function fadeTo(v,ms,done){
  cancelAnimationFrame(fadeT);var a=bgm.volume,t0=performance.now();
  (function f(n){var p=Math.min(1,(n-t0)/ms);bgm.volume=a+(v-a)*p*(2-p);
    if(p<1)fadeT=requestAnimationFrame(f);else if(done)done()})(t0);
}
function musicOn(){bgm.play().then(function(){fadeTo(VOL,1600)}).catch(function(){})}
function musicOff(){fadeTo(0,700,function(){bgm.pause()})}
bgm.addEventListener('ended',function(){bgm.currentTime=0;if(isOpen)musicOn()});
document.addEventListener('visibilitychange',function(){if(document.hidden)bgm.pause();else if(isOpen)musicOn()});

function open(){if(isOpen)return;isOpen=true;document.body.classList.add('open');OS.t=1;kick(OS,13,.72);musicOn();wake()}
function closeBook(){if(!isOpen)return;isOpen=false;document.body.classList.remove('open');PS.drag=false;drag=null;OS.t=0;kick(OS,10,.85);musicOff();wake()}
cover.addEventListener('click',open);
cover.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')open()});
function Wd(){return stack.offsetWidth*.8}
scene.addEventListener('pointerdown',function(e){
  if(drag){PS.drag=false;drag=null}
  if(!canFlip())return;
  drag={id:e.pointerId,x0:e.clientX,p0:PS.x,moved:false,dx:0,h:[]};
  try{scene.setPointerCapture(e.pointerId)}catch(_){}
});
window.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;var dx=e.clientX-drag.x0;
  if(!drag.moved){if(Math.abs(dx)<6)return;drag.moved=true;drag.x0=e.clientX;drag.p0=PS.x;PS.drag=true;PS.v=0;dx=0}
  drag.dx=dx;var raw=drag.p0-dx/Wd(),hi=sheets.length-1;
  if(raw<0)raw*=.3;else if(raw>hi)raw=hi+(raw-hi)*.3;   /* efek karet di ujung buku */
  PS.x=raw;var now=performance.now();drag.h.push([raw,now]);
  while(drag.h.length>2&&now-drag.h[0][1]>100)drag.h.shift();
  wake();
});
function release(e){
  if(!drag)return;
  if(e.pointerId!=null&&e.pointerId!==drag.id)return;
  var d=drag;drag=null;PS.drag=false;
  if(!d.moved){if(!canFlip()||e.type!=='pointerup')return;var b=scene.getBoundingClientRect();(e.clientX>b.left+b.width/2?next:prev)();return}
  var h=d.h,v=0;
  if(h.length>1){var a=h[0],z=h[h.length-1],dt=(z[1]-a[1])/1000;if(dt>.001)v=(z[0]-a[0])/dt}
  v=clamp(v,-14,14);PS.drag=false;
  var b0=Math.round(d.p0),f=PS.x+v*.12+(d.dx<0?.25:-.25);   /* lepas jari: lanjut sesuai arah & kecepatan geser */
  PS.t=clamp(clamp(Math.round(f),b0-1,b0+1),0,sheets.length-1);PS.v=v;kick(PS,16,.92);wake();
}
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
scene.addEventListener('lostpointercapture',release);window.addEventListener('blur',release);
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
function say(t){toast.textContent=t;toast.classList.add('on');setTimeout(function(){toast.classList.remove('on')},1600)}
document.querySelector('.top').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='close')closeBook();else jump(b.dataset.a==='last'?sheets.length-1:0)});
build();
})();
</script>
